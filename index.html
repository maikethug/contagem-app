<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#007AFF">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>CONTAGEM PRESENCIAL</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Impede que o corpo da página dance para os lados, mas permite zoom */
html, body { 
    overflow-x: hidden; 
    width: 100%; 
    min-height: 100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#e0e0e0;
    margin:0;
    padding:8px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px}

.header{background:#fff;padding:8px 10px;text-align:center;border:2.5px solid #000;border-radius:10px}
.titulo{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:#000}
.counter{font-size:46px;font-weight:900;color:#007AFF;line-height:1.1}

.sala{
    background:#fff;
    border:2.5px solid #000;
    border-radius:10px;
    padding:12px 4px;
    display:flex;
    flex-direction:column;
    gap: 7px;
    width: 100%;
}

/* VARIÁVEIS ADAPTATIVAS - Foco no Corredor Visível */
:root{
    --c: clamp(18px, 6vw, 25px); /* Cadeiras um pouco maiores para facilitar o toque */
    --gap: 1.5px;
    --corr: clamp(16px, 6.5vw, 32px); /* Corredor reforçado */
}

.c{
    width:var(--c);
    height:var(--c);
    border:2px solid #000; /* Borda mais forte para os idosos verem melhor */
    border-radius:4px;
    background:#fff;
    flex-shrink:0;
    cursor:pointer;
    user-select:none;
}
.c.sim{background:#007AFF;border-color:#005ccc}

.mini-c{width:22px;height:22px;border:2px solid #000;border-radius:4px;background:#fff;flex-shrink:0;cursor:pointer;}
.mini-c.sim{background:#007AFF;border-color:#005ccc}

.num-spacer{width:28px;flex-shrink:0}

.tribuna{background:#000;color:#fff;border-radius:6px;flex:1;min-height:54px;display:flex;align-items:center;padding:0 10px;position:relative}
.rotulo-trib{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:900;color:#fff}
.item-trib{display:flex;flex-direction:column;align-items:center;gap:2px}
.item-trib span{font-size:7px;color:#bbb;font-weight:900}

.c-trib{width:var(--c);height:var(--c);border:2px solid #666;border-radius:4px;background:transparent;flex-shrink:0;}
.c-trib.sim{background:#007AFF;border-color:#005ccc}

.fileiras{display:flex;flex-direction:column;gap:5px;width:100%}
.fileira{display:flex;align-items:center;justify-content:center;width:100%}

.num{font-size:10px;font-weight:900;width:28px;flex-shrink:0;text-align:right;padding-right:4px}
.bloco{display:flex;gap:var(--gap);flex-shrink:0}

.corredor{
    width:var(--corr);
    min-width: 16px;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-shrink:0;
}

.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:1px}
.mic-wrap span{font-size:6px;font-weight:900;color:#000}

.rodape{display:flex;align-items:center;justify-content:space-between;border-top:1.5px dashed #bbb;padding-top:10px;margin-top:5px}
.grupo{display:flex;flex-direction:column;align-items:center;gap:3px}
.grupo .label{font-size:9px;font-weight:900;color:#000}
.caixa{width:42px;height:42px;border:2px dashed #555;background:#ccc;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#000;text-align:center;flex-shrink:0}

.btn-z{background:#ff3b30;color:#fff;border:2.5px solid #000;padding:10px;border-radius:9px;font-weight:900;font-size:10px;cursor:pointer;white-space:nowrap}
.btn-wpp{background:#25D366;width:45px;height:45px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid #000;cursor:pointer;flex-shrink:0}
.seta{width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid #fff;margin-left:3px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="titulo">ASSISTÊNCIA PRESENCIAL</div>
    <div id="res" class="counter">0</div>
  </div>
  <div class="sala">
    <div style="display:flex;align-items:center">
      <div class="num-spacer"></div>
      <div class="tribuna" id="tribuna-bar">
        <div style="position:absolute" id="pos-leitor">
          <div class="item-trib">
            <div class="c-trib" id="trib-leitor"></div>
            <span>LEITOR</span>
          </div>
        </div>
        <div style="position:absolute;left:50%;transform:translateX(-50%)">
          <div class="item-trib">
            <div class="c-trib" id="trib-orador"></div>
            <span>ORADOR</span>
          </div>
        </div>
        <div class="rotulo-trib">TRIBUNA</div>
      </div>
    </div>
    
    <div class="fileiras" id="mapa"></div>

    <div class="rodape">
      <div class="grupo">
        <div style="display:flex;gap:3px" id="som"></div>
        <div class="label">SOM</div>
      </div>
      <div style="display:flex;align-items:center;gap:5px">
        <div class="caixa">SALA B</div>
        <button class="btn-z" onclick="if(confirm('Zerar tudo?')) location.reload()">ZERAR</button>
        <div class="caixa">W.C</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:5px">
        <div class="btn-wpp" id="btnWpp"><div class="seta"></div></div>
        <div class="grupo">
          <div style="display:flex;gap:3px" id="ind"></div>
          <div class="label">INDICADORES</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// MANTIVE TODA A LÓGICA DE CLIQUE E DESLIZE ORIGINAL
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

const resEl=document.getElementById('res');
function atualizar(){resEl.textContent=document.querySelectorAll('.sim').length}

document.getElementById('btnWpp').onclick=()=>{
  const msg=encodeURIComponent(`Assistência Presencial Hoje: *${resEl.textContent} Pessoas*`);
  window.open(`https://wa.me/?text=${msg}`,'_blank');
};

['som','ind'].forEach((id,i)=>{
  const qtd=i===0?2:3;
  const p=document.getElementById(id);
  for(let j=0;j<qtd;j++){const d=document.createElement('div');d.className='mini-c';p.appendChild(d);}
});

const mapa=document.getElementById('mapa');
for(let i=1;i<=12;i++){
  const n=i<10?'0'+i:''+i;
  const f=document.createElement('div');f.className='fileira';
  const micHTML=`<div class="mic-wrap"><div class="c"></div><span>MIC</span></div>`;
  const corr=(i===12)?micHTML:'';
  f.innerHTML=
    `<div class="num">F${n}</div>`+
    `<div class="bloco">${'<div class="c"></div>'.repeat(3)}</div>`+
    `<div class="corredor">${corr}</div>`+
    `<div class="bloco">${'<div class="c"></div>'.repeat(5)}</div>`+
    `<div class="corredor">${corr}</div>`+
    `<div class="bloco">${'<div class="c"></div>'.repeat(3)}</div>`;
  mapa.appendChild(f);
}

function posicionarLeitor(){
  const trib=document.getElementById('tribuna-bar');
  const bloco=document.querySelector('.fileira .bloco');
  if(!trib||!bloco)return;
  const tribRect=trib.getBoundingClientRect();
  const tRect=bloco.children[2].getBoundingClientRect();
  const cx=tRect.left+tRect.width/2-tribRect.left;
  const posLeitor=document.getElementById('pos-leitor');
  posLeitor.style.left=(cx-(tRect.width/2))+'px';
}
window.addEventListener('load',posicionarLeitor);
window.addEventListener('resize',posicionarLeitor);

const SEL='.c,.mini-c,.c-trib';
const THRESH=8;
let startEl=null,lastEl=null,moved=false,sX=0,sY=0;
function isSeat(el){return el&&el.matches&&el.matches(SEL)}

document.addEventListener('touchstart',e=>{
  const el=e.target;if(!isSeat(el))return;
  startEl=el;lastEl=el;moved=false;
  sX=e.touches[0].clientX;sY=e.touches[0].clientY;
  // Removido o preventDefault aqui para permitir o gesto de pinça nativo do navegador
},{passive:true});

document.addEventListener('touchmove',e=>{
  if(!startEl || e.touches.length > 1) return; // Se houver 2 dedos (pinch), não marca cadeiras
  const t=e.touches[0];
  const dx=t.clientX-sX,dy=t.clientY-sY;
  if(!moved&&(Math.abs(dx)>THRESH||Math.abs(dy)>THRESH)){
    moved=true;
    if(!startEl.classList.contains('sim')){startEl.classList.add('sim');atualizar();}
  }
  if(!moved)return;
  const el=document.elementFromPoint(t.clientX,t.clientY);
  if(isSeat(el)&&el!==lastEl){lastEl=el;if(!el.classList.contains('sim')){el.classList.add('sim');atualizar();}}
},{passive:true});

document.addEventListener('touchend',()=>{
  if(startEl&&!moved){startEl.classList.toggle('sim');atualizar();}
  startEl=null;lastEl=null;moved=false;
},{passive:true});

let mDown=false,mMoved=false,mStart=null,mLast=null,mX=0,mY=0;
document.addEventListener('mousedown',e=>{
  if(!isSeat(e.target))return;
  mDown=true;mMoved=false;mStart=e.target;mLast=e.target;mX=e.clientX;mY=e.clientY;
});
document.addEventListener('mousemove',e=>{
  if(!mDown||!mStart)return;
  if(!mMoved&&(Math.abs(e.clientX-mX)>THRESH||Math.abs(e.clientY-mY)>THRESH)){
    mMoved=true;if(!mStart.classList.contains('sim')){mStart.classList.add('sim');atualizar();}
  }
  if(!mMoved)return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(isSeat(el)&&el!==mLast){mLast=el;if(!el.classList.contains('sim')){el.classList.add('sim');atualizar();}}
});
document.addEventListener('mouseup',()=>{
  if(mStart&&!mMoved){mStart.classList.toggle('sim');atualizar();}
  mDown=false;mStart=null;mLast=null;mMoved=false;
});
</script>
</body>
</html>
